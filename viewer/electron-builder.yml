# electron-builder configuration - cross-platform packaging for the viewer.
#
# Three names, deliberately kept apart (AGENTS.md "Project identity"):
#   productName     what a person sees - Start menu, window, taskbar
#   executableName  the file on disk, matching the tsx-reader-export keyname
#   appId           stable reverse-DNS id; never a display name
appId: dev.tsx-reader-export.viewer
productName: Canvas Reader
executableName: tsx-reader-export-viewer
copyright: Canvas Reader

# Application icon (generated by scripts/make-icon.ps1). electron-builder
# converts this PNG to a multi-resolution Windows .ico. Without it the exe
# falls back to the default Electron icon.
icon: build/icon.png

directories:
  output: dist
  buildResources: build

# asar is DISABLED on purpose. The canvas is bundled at runtime by esbuild,
# which runs as a separate process and cannot read paths inside app.asar - and
# core.mjs needs to write the canvas bundle next to node_modules so the bundle
# can resolve react. Both require real files on disk.
asar: false

# Ship the app source (main/preload/renderer + synced src/) and the runtime
# node_modules (react, esbuild, the cursor/canvas shim, Mantine, Recharts).
files:
  - main.mjs
  - preload.mjs
  - renderer/**
  - src/**
  - package.json
  # MIT requires the notice to travel with the code, and the app ships our
  # src/. Without this the packaged viewer carries the shim's LICENSE (it rides
  # along in node_modules) but none of our own.
  - LICENSE

# esbuild ships a platform-specific native binary; keep it executable.
asarUnpack:
  - "**/node_modules/@esbuild/**"
  - "**/node_modules/esbuild/**"

# The "dir" (unpacked) target is the primary Windows artifact: it needs no
# install and starts in ~0.3s. The "portable" single-file target is kept for
# people who want one file, but note it re-extracts ~200 MB on EVERY launch
# (measured 23s to window) - `portable.unpackDirName` did not avoid that.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "${name}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Canvas Reader

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # zip alongside the dmg: a tester who cannot get past Gatekeeper on the
    # dmg can drag the app straight out of the archive instead.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # UNSIGNED on purpose (AGENTS.md naming: keyname in the filename, never the
  # display name). `identity: null` also stops electron-builder auto-discovering
  # a certificate from a developer's keychain, so a local mac build is identical
  # to the CI one. Signing needs an Apple Developer account, which this
  # repository deliberately does not use. See .github/workflows/release-macos.yml.
  identity: null
  artifactName: "${name}-${version}-mac-${arch}.${ext}"

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
